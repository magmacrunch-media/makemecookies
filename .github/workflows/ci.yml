# CI for makemecookies!x4.
#
# Until this repository existed the rules ran nowhere automatically: the game
# lived inside the website repo, whose workflows do not reach into
# arcade/*/tests/, and it had no test suite at all. The tuning that ships was
# arrived at by simulating full shifts, so the simulation being correct is not
# a detail here — it is the thing the difficulty curve was fitted against.
#
# The health inspector is the reason this job matters most. It is the only
# failure state in the game, a competent shift never triggers it, and it had
# never once been observed in real play. A path nobody walks is a path that
# breaks quietly.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: web simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # No dependencies and no package.json: the suite loads the shipped
      # modules into a vm context using only node's standard library, which is
      # what keeps it honest about testing what ships.
      - name: The rules, headless
        working-directory: web/tests
        run: node test-simulation.js

      # STARS in config.js is derived from this bench, so a change to the oven
      # cycle can silently move what a star is worth: three stars could become
      # unreachable, or one star could become something you get by standing
      # still. Neither shows up in a test of the rules, because the rules would
      # still be correct. A band rather than an exact number, so a tuning commit
      # does not have to edit the check it is meant to answer to.
      - name: The star ladder still slopes
        working-directory: web/tests
        run: node bench-shift.js --check

      # js/stations.js is the simulation and js/moments.js is what the App
      # Store shims are told. Both must stay DOM-free, or the suite above
      # stops being able to load them at all. Cheaper to assert than to
      # rediscover the day someone reaches for getElementById.
      - name: The rules stay DOM-free
        run: |
          for f in web/js/stations.js web/js/moments.js; do
            if grep -nE '\b(document|window|localStorage)\b' "$f"; then
              echo "::error file=$f::$f must not touch the DOM; the headless suite loads it without one"
              exit 1
            fi
            echo "$f is clean"
          done

  # The same rules again, in C. The host tests need nothing but a compiler —
  # source/stations.c is free of libogc and GRRLIB — so they run on a
  # GitHub-hosted runner. The console build is the job below, which needs no
  # particular machine either: devkitPro publish the toolchain as a container.
  #
  # Two versions of one game are only one game for as long as something keeps
  # checking, and this job is that something. The rules are what a port gets
  # wrong, and it gets them wrong in ways that look like being right.
  wii:
    name: wii simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: make test
        working-directory: wii
        run: make test

      # source/stations.c is the simulation and must stay free of the engine,
      # or the job above stops being able to link it at all — the same property
      # the web job asserts of stations.js, and lost the same way: one include
      # reached for in a hurry.
      - name: The rules stay engine-free
        run: |
          if grep -nE '#include[[:space:]]*[<"](grrlib|ogc/|magnolia|gccore)' wii/source/stations.c; then
            echo "::error file=wii/source/stations.c::stations.c must not include the engine — the host suite links it without one"
            exit 1
          fi
          echo "stations.c is clean"

  wii-build:
    name: wii build
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      # Checked out into a subdirectory so the engine can sit beside it. That is
      # the layout the Makefile documents and a flat clone produces, so `make`
      # resolves the engine through its own first default candidate rather than
      # a MAGNOLIA= override this job would have to keep correct.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: makemecookies

      # Tracks main rather than a pinned ref, deliberately. An engine change
      # that breaks this game should redden this repo on the day it lands.
      - name: Check out the engine beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magnolia
          path: magnolia

      # GRRLIB is not a dkp-pacman package - it is built from source into the
      # portlibs tree, and its own dependencies arrive with the image's
      # ppc-portlibs and wii-portlibs groups. Pinned, so an upstream commit
      # cannot turn this red on a day nobody touched it; v4.6.1 is what
      # magnolia's own CI installs.
      - name: install GRRLIB
        run: |
          git clone --depth 1 --branch v4.6.1 https://github.com/GRRLIB/GRRLIB.git /tmp/grrlib
          make -C /tmp/grrlib/GRRLIB clean all install

      - name: make
        working-directory: makemecookies/wii
        run: make

      - name: The .dol exists
        run: test -f makemecookies/wii/build/makemecookies.dol

  # ── the iOS port ────────────────────────────────────────────────────────────
  #
  # Added with step 2 of the App Store port. These matter more than the jobs
  # above do for their versions, because **nothing in the iOS work can be
  # verified on the dev box**, which runs Windows. package.mjs runs there; the
  # Xcode project cannot be built or even parsed. The project was assembled by
  # script on Windows, so the macOS job below is the first thing that has ever
  # compiled this app.

  # What package.mjs asserts about itself, on a runner with no Xcode: the SHARED
  # allowlist, the no-op-is-fatal rule on every transform, and the final sweep
  # for ../ paths and network assets. The website is a repo this one does not
  # watch, and a script appearing in its shared folder is exactly the failure
  # those guards exist for, so the bundle is built here from the website's main.
  ios-bundle:
    name: ios bundle
    runs-on: ubuntu-latest
    steps:
      # The flat layout, findWebsite()'s second candidate (../website from the
      # game root) and what a pair of plain clones produces, so there is no
      # WEBSITE= override here to keep correct.
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: makemecookies

      - name: Check out the website beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magmacrunch.com
          path: website

      # The pipeline itself lives in the shell now, resolved by path the way the
      # Wii Makefiles resolve magnolia: `../hypnopompia` from the game root is
      # its second candidate, so this layout needs no HYPNOPOMPIA= override
      # either. A game that cannot find it fails by name rather than with a
      # module error three frames deep.
      - name: Check out the iOS shell beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/hypnopompia
          path: hypnopompia

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the bundle from web/
        working-directory: makemecookies/ios
        run: node package.mjs

      # package.mjs reports "self-contained" and this is the same claim checked
      # independently, in case a transform is ever added without its guard.
      - name: The bundle reaches nothing outside itself
        working-directory: makemecookies/ios/www
        run: |
          if grep -rInE '(src|href)="\.\./' . ; then echo "reaches outside the bundle"; exit 1; fi
          if grep -rInE '<(script|link|img|source|audio)[^>]*(src|href)="https?:' . ; then echo "loads over the network"; exit 1; fi
          echo "clean"

  # The committed app icon against the sprite table it is drawn from.
  #
  # The cookie's shape lives in web/js/pixels.js as SPR_COOKIE_BIG, which the
  # title card blits and make-cookie-pixel.py parses, so the two cannot show
  # different cookies. What that arrangement moved rather than removed is the
  # gap between the table and the PNGs in the asset catalog: those are
  # committed artifacts, and while the shape lived in the script, editing it
  # and regenerating were the same act. They are two acts now, and skipping
  # the second leaves an icon that is wrong in a way nothing in the repo
  # mentions -- the game draws the new cookie, the home screen keeps the old.
  #
  # --check regenerates both icons and compares PIXELS against the committed
  # PNGs, the way roblox/tools/make_atlas.py --check does in moonlight-drift.
  # Regenerating and asking git whether anything moved is the obvious version
  # and it is a flake: it fails the moment this runner's Pillow encodes the
  # identical image with different compression to the one the last person had.
  ios-art:
    name: ios art
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pillow
        run: pip install --quiet pillow

      - name: The icon still matches web/js/pixels.js
        run: python ios/tools/make-cookie-pixel.py --check

  # The vendored Game Center plugin against its upstream in engines/hypnopompia.
  # Editing the Swift here is invisible from this repo, because a copy always
  # verifies clean against itself, so the check runs from the shell's end with
  # this game checked out beside it. The mirror case, a change in the shell that
  # leaves this game stale, is caught by the same command in hypnopompia's CI.
  ios-shared:
    name: ios shared half
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game where consumers.json expects it
        uses: actions/checkout@v7
        with:
          path: games/makemecookies

      - name: Check out the iOS shell beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/hypnopompia
          path: engines/hypnopompia

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The strict form, which exits 2 rather than 0 when it compared nothing, so
      # a checkout that silently failed cannot read as a pass.
      - name: The vendored plugin matches the shell
        working-directory: engines/hypnopompia
        run: npm run check

  # The app itself, and the only thing that has ever compiled it. The two
  # vendored Swift files and PrivacyInfo.xcprivacy were wired into project.pbxproj
  # by script on a machine with no Xcode, and a file the project fails to list is
  # not a warning: GameViewController would simply not exist while
  # Main.storyboard names it, so the app would fail at launch after building
  # perfectly.
  #
  # Package.resolved is deliberately not committed yet, because only SPM on a Mac
  # can generate it. So this job resolves capacitor-swift-pm fresh each run and
  # may pick a version no human has tried. Commit the Package.resolved it
  # produces once somebody has run the app on a real device.
  ios-build:
    name: ios build
    runs-on: macos-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v7
        with:
          path: makemecookies

      - name: Check out the website beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/magmacrunch.com
          path: website

      # The pipeline itself lives in the shell now, resolved by path the way the
      # Wii Makefiles resolve magnolia: `../hypnopompia` from the game root is
      # its second candidate, so this layout needs no HYPNOPOMPIA= override
      # either. A game that cannot find it fails by name rather than with a
      # module error three frames deep.
      - name: Check out the iOS shell beside it
        uses: actions/checkout@v7
        with:
          repository: magmacrunch-media/hypnopompia
          path: hypnopompia

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the Capacitor CLI
        working-directory: makemecookies/ios
        run: npm ci

      - name: Build the bundle from web/
        working-directory: makemecookies/ios
        run: node package.mjs

      - name: Sync it into the Xcode project
        working-directory: makemecookies/ios
        run: npx cap sync ios

      # A generic destination rather than a named simulator: nothing here boots a
      # device, and a name that exists on the dev Mac need not exist on the runner
      # image. Signing is off because the simulator needs none. There is no
      # App.entitlements yet, deliberately, so nothing fails on a Game Center
      # capability that has not been enabled for this bundle id.
      - name: xcodebuild
        working-directory: makemecookies/ios/App/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build

      - name: The app was produced
        run: test -d "$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"

      # Two things a successful compile does not prove on its own: that the
      # plugin's class survived into the binary, and that the privacy manifest is
      # in the bundle rather than only in the repo.
      - name: GameCenterPlugin and the privacy manifest are in the app
        run: |
          APP="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/App.app"
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "PrivacyInfo.xcprivacy missing from the bundle"; exit 1; }
          nm -a "$APP/App" | grep -q GameCenterPlugin || { echo "GameCenterPlugin not in the binary"; exit 1; }
          echo "both present"
